# =============================================================================
# Cinder volume backend override — NFS mount options
#
# Kolla's template generates the base NFS config automatically when
# enable_cinder_backend_nfs: "yes".  This override adds NFS mount options
# and other performance tuning that the template does not include.
#
# The backend section name MUST match cinder_backend_nfs_name from globals.yml.
# =============================================================================

[nfs-backend]
nfs_mount_options = vers=4,noatime,nodiratime,rsize=1048576,wsize=1048576
nfs_mount_point_base = /var/lib/cinder/nfs
nfs_sparsed_volumes = True
nfs_qcow2_volumes = False
volume_dd_blocksize = 1M

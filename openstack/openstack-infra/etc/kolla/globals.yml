# =============================================================================
# Kolla-Ansible globals.yml — Caracal 2024.1 / 17.0.0
# Single-node GitOps deployment — Ubuntu 24.04 host
#
# This file overrides defaults from:
#   ansible/group_vars/all.yml (shipped with kolla-ansible)
#
# Container images: quay.io/openstack.kolla (tag: 2024.1-ubuntu-jammy)
# =============================================================================

###################
# Kolla core
###################

kolla_base_distro: "ubuntu"
openstack_release: "2024.1"

# Quay.io is the official Kolla image registry as of Caracal
docker_registry: "quay.io"
docker_namespace: "openstack.kolla"

##############################
# Networking
##############################

network_interface: "ens3"
neutron_external_interface: "ens4"

kolla_internal_vip_address: "192.168.0.150"
kolla_internal_fqdn: "{{ kolla_internal_vip_address }}"
kolla_external_fqdn: "{{ kolla_internal_vip_address }}"

##############################
# Neutron — OVN + provider networks
##############################

neutron_plugin_agent: "ovn"
enable_neutron_provider_networks: "yes"

##############################
# OpenStack services
##############################

enable_cinder: "yes"
enable_cinder_backend_nfs: "yes"
enable_cinder_backend_lvm: "no"

enable_heat: "no"
enable_swift: "no"
enable_octavia: "no"

##############################
# Glance — NFS file store
##############################

glance_backend_file: "yes"
glance_file_datadir_volume: "/var/lib/glance/images"

##############################
# Cinder — NFS backend
##############################

cinder_backend_nfs_name: "nfs-backend"

##############################
# Nova — KVM
##############################

nova_compute_virt_type: "kvm"

[openstack]
# Your Ubuntu 24.04 worker node (min 16GB RAM, 4 cores, 50GB disk + LVM volume)
openstack-node ansible_host=192.168.0.XX ansible_user=root

[openstack:vars]
# Network: bridge interface on the node (e.g., the same vmbr0 used by Proxmox VMs)
# MicroStack will use this for OVS/Neutron networking
bridge_interface=ens18
# LVM volume group for Cinder block storage (create a spare disk/partition first)
cinder_vg=cinder-volumes
# OpenStack release (2024.2 = Caracal, latest stable)
microstack_channel=2024.2/stable

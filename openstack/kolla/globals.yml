workaround_ansible_issue_8743: true
kolla_base_distro: "ubuntu"
kolla_container_engine: docker
openstack_region_name: "rs-east-1"
openstack_release: "2026.1"
enable_openstack_core: true


# networking
network_interface: "eno1"
neutron_external_interface: "eno2"

enable_haproxy: false
enable_proxysql: false
enable_keepalived: false

kolla_internal_vip_address: "192.168.0.14"
kolla_external_vip_address: "{{ kolla_internal_vip_address }}"

neutron_dns_domain: "eci.eduardoschulz.com.br."

# compute nova
nova_compute_virt_type: "kvm"

# storage cinder
enable_cinder: true
enable_cinder_backend_lvm: true
enable_cinder_backend_nfs: true

# octavia loadbalancer
enable_octavia: true
octavia_network_type: "tenant"
enable_valkey: true

# billing 
enable_gnocchi: true
enable_ceilometer: true
enable_cloudkitty: true

# extra services
enable_mistral: false
enable_trove: true

#extra extra
enable_magnum: true
enable_designate: true
designate_backend: "bind9"
designate_ns_record:
  - "ns1.eci.eduardoschulz.com.br"

horizon_custom_themes:
  - name: eci
    label: eci
  - name: daemon
    label: Daemon

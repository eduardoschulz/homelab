#cloud-config
# Prepares an Ubuntu 24.04 host for kolla-ansible deployment
# Requirements: 2 NICs, 8GB+ RAM, 40GB+ disk (set in Terraform)
hostname: ubuntu-kolla
fqdn: ubuntu-kolla.local

package_update: true
package_upgrade: true

packages:
  - qemu-guest-agent
  - git
  - python3-dev
  - libffi-dev
  - gcc
  - libssl-dev
  - libdbus-glib-1-dev
  - python3-venv
  - python3-pip
  - curl
  - wget
  - vim
  - htop

runcmd:
  # Enable guest agent
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent

  # Create kolla venv
  - python3 -m venv /opt/kolla-venv
  - /opt/kolla-venv/bin/pip install -U pip

  # Install kolla-ansible
  - /opt/kolla-venv/bin/pip install git+https://opendev.org/openstack/kolla-ansible@master

  # Prepare config directories
  - mkdir -p /etc/kolla
  - cp -r /opt/kolla-venv/share/kolla-ansible/etc_examples/kolla/* /etc/kolla/ || true

  # Generate passwords (uncomment after first boot if needed manually)
  # - /opt/kolla-venv/bin/kolla-genpwd

  # Install ansible galaxy deps
  - /opt/kolla-venv/bin/kolla-ansible install-deps || true

  # Copy all-in-one inventory
  - cp /opt/kolla-venv/share/kolla-ansible/ansible/inventory/all-in-one /root/ || true

final_message: "Kolla Ansible base setup complete. Edit /etc/kolla/globals.yml and run bootstrap-servers."

# Optional: write out a basic globals.yml placeholder
write_files:
  - path: /root/kolla-next-steps.txt
    permissions: "0644"
    content: |
      Kolla Ansible Quickstart - Next Steps:
      =====================================

      1. Activate venv:
         source /opt/kolla-venv/bin/activate

      2. Edit /etc/kolla/globals.yml:
         - kolla_base_distro: "ubuntu"
         - network_interface: "eth0" (management NIC)
         - neutron_external_interface: "eth1" (external NIC, no IP)
         - kolla_internal_vip_address: "<floating-ip>"

      3. Bootstrap servers:
         kolla-ansible bootstrap-servers -i /root/all-in-one

      4. Pre-deploy checks:
         kolla-ansible prechecks -i /root/all-in-one

      5. Deploy OpenStack:
         kolla-ansible deploy -i /root/all-in-one

      6. Post-deploy (generate admin creds):
         kolla-ansible post-deploy

      7. Install OpenStack CLI:
         pip install python-openstackclient

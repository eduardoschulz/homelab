apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cert
  namespace: istio-ingress
spec:
  secretName: wildcard-tls
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
    #todo refactor this in the future
  commonName: "*.eduardoschulz.com.br"
  dnsNames:
    - "*.eduardoschulz.com.br"
    - "eduardoschulz.com.br"

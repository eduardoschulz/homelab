immich:
  immich:
    persistence:
      library:
        existingClaim: "immich-exp-nfs-pvc"
    configuration:
      redis:
        host: "immich-valkey"
      database:
        host: "immich-postgresql"

  redis:
    enabled: true

  postgresql:
    enabled: true
    image:
      repository: tensorchord/pgvecto-rs
      tag: pg16-v0.2.0

  server:
    enabled: true
    ingress:
      main:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-issuer
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: immich.eduardoschulz.com.br
            paths:
              - path: "/"
                service:
                  identifier: main
        tls:
          - secretName: immich-tls-cert
            hosts:
              - immich.eduardoschulz.com.br
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              pullPolicy: IfNotPresent

  machine-learning:
    enabled: false
